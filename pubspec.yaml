name: flutter_idrive_offline
description: "A completely offline, zero-cloud companion app for BMW/MINI iDrive using Bluetooth SPP and BCL."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  latlong2: ^0.9.0
  flutter_map: ^6.1.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rhmi/
