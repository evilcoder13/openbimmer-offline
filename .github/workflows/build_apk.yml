name: Build OpenBimmer Offline APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbimmer-offline-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="build-${{ github.run_number }}"
          RELEASE_TITLE="OpenBimmer Offline Build #${{ github.run_number }}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          # 1. Tạo GitHub Release và đính kèm file APK
          gh release create "$TAG_NAME" "$APK_PATH#openbimmer-offline-v${{ github.run_number }}.apk" \
            --title "$RELEASE_TITLE" \
            --notes "Automated build from commit ${{ github.sha }}."

          # 2. Xóa các release cũ hơn, chỉ giữ lại 3 bản release gần nhất
          echo "Dọn dẹp các release cũ, giữ lại 3 release mới nhất..."
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:][].tagName' | while read -r old_tag; do
            if [ -n "$old_tag" ]; then
              echo "Đang xóa release cũ: $old_tag"
              gh release delete "$old_tag" -y --cleanup-tag
            fi
          done
